name: sweepy

services:
  sweepy:
    container_name: sweepy
    image: ghcr.io/casscassca/sweepy:latest
    build: .
    env_file:
      - path: .env
        required: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SWEEPY_PORT:-3000}:3000"
    volumes:
      - sweepy-data:/app/data
    environment:
      TZ: ${TZ:-America/Chicago}
    restart: unless-stopped

  backup:
    profiles: ["backup"]
    container_name: sweepy-backup
    image: ghcr.io/casscassca/sweepy:backup
    build:
      context: .
      dockerfile: Dockerfile
      target: backup
    env_file:
      - path: .env
        required: true
    environment:
      TZ: ${TZ:-America/Chicago}
      RCLONE_REMOTE: gdrive:backups/sweepy
      PGSSLMODE: require
    volumes:
      - ${HOME}/.config/rclone:/root/.config/rclone
    restart: unless-stopped

volumes:
  sweepy-data:
