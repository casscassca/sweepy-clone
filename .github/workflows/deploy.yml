name: Publish and deploy to Pi

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker
  cancel-in-progress: true

jobs:
  # Native arm64 (no QEMU). The Pi is the only place this image runs.
  publish-docker-image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push the backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: backup
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:backup
          platforms: linux/arm64
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: Build and push the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Repo-scoped runner at ~/actions-runners/sweepy (same pattern as
  # actual-helpers). Operates on the home-dir checkout, not _work.
  deploy-pi:
    needs: publish-docker-image
    runs-on: self-hosted
    steps:
      - name: Pull and recreate Sweepy
        working-directory: /home/cassandrameijers/sweepy
        run: |
          set -euo pipefail
          git pull --ff-only
          docker compose --profile backup pull
          docker compose --profile backup up -d
          docker image prune -f
          docker ps --filter name=sweepy --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
